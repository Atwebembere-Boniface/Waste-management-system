{% extends 'base.html' %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 90vh; padding: 20px; background-color: #f4f7f6;">
    <div style="max-width: 420px; width: 100%; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); border-top: 5px solid #2e7d32;">

        <div style="text-align: center; margin-bottom: 28px;">
            <div style="width: 60px; height: 60px; background: #e8f5e9; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; font-size: 1.8em;">
                ♻️
            </div>
            <h2 style="color: #2e7d32; margin: 0 0 6px 0;">Welcome Back</h2>
            <p style="color: #888; font-size: 0.88em; margin: 0;">Kabale Smart Waste Management System</p>
        </div>

        {% if form.errors %}
            <div style="padding: 12px 16px; background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; border-radius: 8px; margin-bottom: 18px; font-size: 0.88em;">
                ⚠ Invalid username or password. Please try again.
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div style="margin-bottom: 18px;">
                <label style="display: block; font-weight: 600; margin-bottom: 6px; color: #333; font-size: 0.85em;">
                    Username <span style="color: #d32f2f;">*</span>
                </label>
                <input type="text" name="username" autofocus autocomplete="username"
                    placeholder="Enter your username"
                    style="width: 100%; padding: 12px; border: 1px solid #ccd0d5; border-radius: 6px; box-sizing: border-box; font-size: 0.95em; font-family: inherit;"
                    onfocus="this.style.borderColor='#2e7d32'; this.style.boxShadow='0 0 0 3px rgba(46,125,50,0.1)'"
                    onblur="this.style.borderColor='#ccd0d5'; this.style.boxShadow='none'">
            </div>

            <div style="margin-bottom: 24px;">
                <label style="display: block; font-weight: 600; margin-bottom: 6px; color: #333; font-size: 0.85em;">
                    Password <span style="color: #d32f2f;">*</span>
                </label>
                <input type="password" name="password" autocomplete="current-password"
                    placeholder="Enter your password"
                    style="width: 100%; padding: 12px; border: 1px solid #ccd0d5; border-radius: 6px; box-sizing: border-box; font-size: 0.95em; font-family: inherit;"
                    onfocus="this.style.borderColor='#2e7d32'; this.style.boxShadow='0 0 0 3px rgba(46,125,50,0.1)'"
                    onblur="this.style.borderColor='#ccd0d5'; this.style.boxShadow='none'">
            </div>

            <input type="hidden" name="next" value="{{ next }}">

            <button type="submit"
                style="width: 100%; padding: 14px; background-color: #2e7d32; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 1em; cursor: pointer; transition: background 0.3s;"
                onmouseover="this.style.background='#1b5e20'"
                onmouseout="this.style.background='#2e7d32'">
                Log In
            </button>
        </form>

        <div style="margin-top: 24px; padding-top: 20px; border-top: 1px solid #eee; text-align: center;">
            <p style="color: #666; font-size: 0.88em; margin: 0 0 10px 0;">
                New resident?
                <a href="{% url 'register' %}" style="color: #2e7d32; font-weight: bold; text-decoration: none;">
                    Create a resident account
                </a>
            </p>
            <p style="color: #bbb; font-size: 0.78em; margin: 0;">
                Municipality staff?
                <a href="{% url 'admin_register' %}" style="color: #999; text-decoration: none; border-bottom: 1px dashed #ccc;">
                    Admin registration
                </a>
            </p>
        </div>

    </div>
</div>

{% endblock %}
